name: Build PIECE OF PAST 8 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # 1. Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. NPM paketlerini kur
      - name: Install dependencies
        run: npm install

      # --- EKLENEN ADIM ---
      # 5. Web uygulamasını oluştur (Build)
      - name: Build web app
        run: npm run build

      # 6. www klasörünü kontrol et
      - name: Check web files
        run: |
          echo "www klasörü:"
          ls -lah www

          test -f www/index.html

          echo "www/index.html bulundu."

      # 7. Android platformunu oluştur
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "android klasörü zaten mevcut."
          fi

      # 8. Capacitor sync
      - name: Capacitor sync
        run: npx cap sync android

      # 9. Launcher ikonlarını yükle
      - name: Install PIECE OF PAST 8 launcher icons
        run: |
          echo "Installing PIECE OF PAST 8 icons..."

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          cp android-icons/mipmap-mdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          cp android-icons/mipmap-hdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          cp android-icons/mipmap-xhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          cp android-icons/mipmap-xxhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          cp android-icons/mipmap-xxxhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # Round ikon
          cp android-icons/mipmap-mdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          cp android-icons/mipmap-hdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          cp android-icons/mipmap-xhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          cp android-icons/mipmap-xxhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          cp android-icons/mipmap-xxxhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          echo "Icons installed successfully."

      # 10. Adaptive ikon çakışmalarını kaldır
      - name: Remove adaptive launcher icons
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          rm -f android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml

          echo "Adaptive launcher icons removed."

      # 11. Android ikonlarını kontrol et
      - name: Verify launcher icons
        run: |
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "All PIECE OF PAST 8 icons verified."

      # 12. APK oluştur
      - name: Build PIECE OF PAST 8 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      # 13. APK Artifact
      - name: Upload PIECE OF PAST 8 APK
        uses: actions/upload-artifact@v4
        with:
          name: piece-of-past-8-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 14. GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PIECE OF PAST 8 - Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
